[workspace]
resolver = "2"
members = [
  "extism-maturin",
  "manifest",
  "runtime",
  "libextism",
  "convert",
  "convert-macros",
  "wasm3-sys",
  "store",
]
exclude = ["kernel"]
# kernel stays its own workspace so `build.sh` can target wasm32 without
# pulling wasm-bindgen into this workspace's lockfile. wasm3-sys tests depend
# on it via path.

[workspace.package]
edition = "2021"
authors = ["The Extism Authors", "oss@extism.org"]
license = "BSD-3-Clause"
homepage = "https://extism.org"
repository = "https://github.com/extism/extism"
version = "0.0.0+replaced-by-ci"

[workspace.dependencies]
extism = { path = "./runtime", version = "0.0.0+replaced-by-ci" }
extism-convert = { path = "./convert", version = "0.0.0+replaced-by-ci" }
extism-convert-macros = { path = "./convert-macros", version = "0.0.0+replaced-by-ci" }
extism-manifest = { path = "./manifest", version = "0.0.0+replaced-by-ci" }
extism-store = { path = "./store", version = "0.0.0+replaced-by-ci" }
